name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run local manifest audit
        uses: ./
        with:
          manifest-path: 'sample-manifest.json'
          min-score: 80
          fail-on-error: true
